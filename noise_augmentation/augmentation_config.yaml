# Augmentation settings for the ICASSP 2026 noise domains (Table 1, docs/noise_domains.md).

background_noise:            # D1 — environmental/natural sounds
  aug_type: background_noise
  noise_path: "${HOME}/noise-tracing/Datasets/ESC-50/audio"
  min_SNR_dB: -6
  max_SNR_dB: 3

background_music:            # D1
  aug_type: background_music
  music_path: "${HOME}/noise-tracing/Datasets/musan/music"
  min_SNR_dB: 10
  max_SNR_dB: 20

auto_tune:                   # D2 — run via generate_audio_autotune.py
  aug_type: auto_tune
  correction_method: closest

band_pass_filter:            # D3 — band-limited speech, poles = 1
  aug_type: band_pass_filter
  highpass: 300
  lowpass: 3400

echo:                        # D4
  aug_type: echo
  min_delay: 0.05
  max_delay: 1.5
  min_decay: 0.2
  max_decay: 1.0

pitch_shift:                 # D5 — |shift| in [2, 5] semitones, random sign
  aug_type: pitch_shift
  min_abs_semitones: 2
  max_abs_semitones: 5

time_stretch:                # D5 — speed change without pitch change
  aug_type: time_stretch
  min_factor: 0.6
  max_factor: 1.4

gaussian_noise:              # D6
  aug_type: gaussian_noise
  min_std_dev: 0.01
  max_std_dev: 0.2
  mean: 0.0

reverberation:               # D7
  aug_type: reverberation
  rir_path: "${HOME}/noise-tracing/Datasets/RIRS_NOISES"
